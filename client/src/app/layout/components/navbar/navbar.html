<nav class="fixed top-0 left-0 right-0 z-50 bg-gray-900/95 backdrop-blur border-b border-gray-800 text-white">
  <div class="container mx-auto px-4 sm:px-6 lg:px-10 relative">

    <!-- Peer Checkbox for mobile menu toggle -->
    <input type="checkbox" id="nav-toggle" class="peer hidden" />

    <div class="flex items-center justify-between h-16">

      <!-- Logo (Left) -->
      <a routerLink="/home" class="flex items-center gap-2 cursor-pointer">
        <span class="text-xl font-bold bg-gradient-to-r from-indigo-500 to-purple-500 bg-clip-text text-transparent">
          DatingApp
        </span>
      </a>

      <!-- Desktop Links & Action Buttons -->
      <div class="flex items-center gap-4 sm:gap-6">

        <!-- Nav Links (Desktop) -->
        <div class="hidden md:flex items-center gap-6 text-sm font-medium">
          <a
            routerLink="/home"
            [routerLinkActiveOptions]="{exact: true}"
            routerLinkActive="text-indigo-400 font-semibold"
            class="text-gray-300 hover:text-indigo-400 transition-colors"
          >Home</a>
          <a
            routerLink="/matches"
            routerLinkActive="text-indigo-400 font-semibold"
            class="text-gray-300 hover:text-indigo-400 transition-colors"
          >Matches</a>
          <a
            routerLink="/messages"
            routerLinkActive="text-indigo-400 font-semibold"
            class="text-gray-300 hover:text-indigo-400 transition-colors"
          >Messages</a>
        </div>

        <!-- Desktop Action Buttons & Dropdown -->
        <div class="hidden sm:flex items-center gap-3">

          @if (currentUser(); as user) {
            <!-- Desktop User Profile Dropdown -->
            <div class="relative group">
              <button class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors border border-gray-700 cursor-pointer">
                <img
                  [src]="user.imageUrl || 'assets/images/placeholder.jpg'"
                  [alt]="user.displayName"
                  class="w-7 h-7 rounded-full object-cover border border-indigo-500/50"
                />
                <span class="text-sm font-medium text-gray-200">{{ user.displayName }}</span>
                <svg class="w-4 h-4 text-gray-400 group-hover:rotate-180 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </button>

              <!-- Dropdown Menu -->
              <div class="absolute right-0 top-full mt-2 w-48 bg-gray-800 border border-gray-700 rounded-xl shadow-xl py-1 hidden group-hover:block z-50">
                <a [routerLink]="['/matches', user.id]" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 hover:text-white transition-colors cursor-pointer">
                  Edit Profile
                </a>
                <div class="border-t border-gray-700 my-1"></div>
                <button (click)="logout()" class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-gray-700 hover:text-red-300 transition-colors cursor-pointer">
                  Logout
                </button>
              </div>
            </div>
          } @else {
            <!-- Login & Register Buttons (Logged Out) -->
            <a
              routerLink="/auth/login"
              class="bg-violet-600 hover:bg-violet-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-violet-600/30 inline-flex items-center justify-center cursor-pointer"
            >
              Login
            </a>

            <a
              routerLink="/auth/register"
              class="group relative bg-gradient-to-r from-fuchsia-600 to-pink-600 hover:from-fuchsia-500 hover:to-pink-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300 inline-flex items-center gap-1.5 shadow-md shadow-fuchsia-600/20 hover:shadow-[0_0_20px_rgba(217,70,239,0.6)] hover:-translate-y-0.5 hover:scale-105 cursor-pointer"
            >
              <span class="flex items-center gap-1.5">
                Register
                <svg class="w-4 h-4 transition-transform duration-200 group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                </svg>
              </span>
            </a>
          }

        </div>

        <!-- Theme Picker -->
        <details #themeDropdown class="relative">
          <summary
            class="flex h-10 w-10 cursor-pointer list-none items-center justify-center rounded-lg border border-gray-700 bg-gray-800 text-gray-300 transition-colors hover:bg-gray-700 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-400 [&::-webkit-details-marker]:hidden"
            aria-label="Choose a theme"
            title="Choose a theme"
          >
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 3a9 9 0 1 0 0 18h1.2a2.3 2.3 0 0 0 1.7-3.8 1.8 1.8 0 0 1 1.4-3h.8A4.9 4.9 0 0 0 22 9.3C22 5.8 17.5 3 12 3Z" />
              <path stroke-linecap="round" stroke-width="2" d="M7.5 10h.01M10 6.5h.01M15 7h.01M17.5 10h.01" />
            </svg>
          </summary>

          <div class="absolute right-0 top-full z-50 mt-2 max-h-80 w-48 overflow-y-auto rounded-xl border border-gray-700 bg-gray-900 p-2 shadow-xl">
            <p class="px-3 py-2 text-xs font-semibold uppercase tracking-wider text-gray-500">Choose theme</p>
            @for (theme of themes; track theme) {
              <button
                type="button"
                (click)="handleSelectTheme(theme, themeDropdown)"
                [attr.aria-pressed]="selectedTheme() === theme"
                class="flex w-full items-center justify-between rounded-lg px-3 py-2 text-left text-sm capitalize transition-colors hover:bg-gray-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-400"
                [class.text-indigo-400]="selectedTheme() === theme"
                [class.text-gray-300]="selectedTheme() !== theme"
              >
                {{ theme }}
                @if (selectedTheme() === theme) {
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m5 12 4 4L19 6" />
                  </svg>
                }
              </button>
            }
          </div>
        </details>

        <!-- Mobile Hamburger Icon -->
        <label
          for="nav-toggle"
          class="md:hidden p-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 cursor-pointer select-none"
          aria-label="Toggle Navigation Menu"
        >
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </label>

      </div>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div class="hidden peer-checked:block md:peer-checked:hidden absolute top-16 left-0 right-0 bg-gray-900 border-b border-gray-800 px-4 pt-3 pb-5 space-y-3 shadow-2xl z-50">

      <a
        routerLink="/home"
        [routerLinkActiveOptions]="{exact: true}"
        routerLinkActive="text-indigo-400 font-semibold bg-gray-800"
        class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-indigo-400 hover:bg-gray-800 transition-colors"
      >Home</a>
      <a
        routerLink="/matches"
        routerLinkActive="text-indigo-400 font-semibold bg-gray-800"
        class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-indigo-400 hover:bg-gray-800 transition-colors"
      >Matches</a>
      <a
        routerLink="/messages"
        routerLinkActive="text-indigo-400 font-semibold bg-gray-800"
        class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-indigo-400 hover:bg-gray-800 transition-colors"
      >Messages</a>

      @if (currentUser(); as user) {
        <!-- Mobile Logged In User Options -->
        <div class="border-t border-gray-800 pt-3">
          <div class="flex items-center gap-3 px-3 py-2 mb-2 bg-gray-800/50 rounded-lg">
            <img
              [src]="user.imageUrl || 'assets/images/placeholder.jpg'"
              [alt]="user.displayName"
              class="w-9 h-9 rounded-full object-cover border border-indigo-500/50"
            />
            <span class="text-sm font-medium text-white">{{ user.displayName }}</span>
          </div>

          <a
            [routerLink]="['/matches', user.id]"
            class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-800 transition-colors"
          >Edit Profile</a>

          <button
            (click)="logout()"
            class="w-full text-left px-3 py-2 rounded-md text-base font-medium text-red-400 hover:bg-gray-800 transition-colors cursor-pointer"
          >
            Logout
          </button>
        </div>
      } @else {
        <!-- Mobile Logged Out Options -->
        <div class="border-t border-gray-800 pt-3 flex flex-col gap-2.5">
          <a
            routerLink="/auth/login"
            class="w-full text-center bg-violet-600 hover:bg-violet-500 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-violet-600/30"
          >
            Login
          </a>

          <a
            routerLink="/auth/register"
            class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-fuchsia-600 to-pink-600 hover:from-fuchsia-500 hover:to-pink-500 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition-colors shadow-md shadow-fuchsia-600/20"
          >
            <span>Register</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
            </svg>
          </a>
        </div>
      }

    </div>

  </div>
</nav>
