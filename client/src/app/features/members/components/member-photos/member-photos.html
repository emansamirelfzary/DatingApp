<section class="mx-auto max-w-6xl px-4 py-8 text-white">
 <a
   [routerLink]="['/matches', memberId()]"
   class="mb-6 inline-flex text-indigo-400 hover:text-indigo-300"
 >Back to profile</a>

 <h1 class="mb-6 text-2xl font-bold">Photos</h1>

 @if (memberId()) {
   <app-member-photo-list [memberId]="memberId()" [canUpload]="memberId() === currentUser()?.id" />
 }
</section>
