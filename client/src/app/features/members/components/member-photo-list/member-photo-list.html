@if (isLoading()) {
  <p class="text-sm text-gray-400">Loading photos...</p>
} @else if (photos().length) {
  <div
    [class]="previewLimit === null
      ? 'grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4'
      : 'grid grid-cols-3 gap-3'"
  >
    @for (photo of photos().slice(0, previewLimit ?? photos().length); track photo.id) {
      <img
        [src]="photo.url"
        [alt]="photo.isMain ? 'Main profile photo' : 'Member photo'"
        class="aspect-square w-full rounded-xl object-cover border border-gray-800 bg-gray-950"
      />
    }
  </div>
} @else {
  <p class="text-sm text-gray-400">This member has not added any photos yet.</p>
}

@if (canUpload) {
  <div class="mt-4">
    <label for="member-photo-upload" class="inline-flex cursor-pointer items-center gap-2 rounded-md bg-blue-600 px-3 py-2 text-sm font-medium text-white hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-60">
      <span>{{ isUploading() ? 'Uploading...' : 'Upload photo' }}</span>
      <input
        id="member-photo-upload"
        type="file"
        accept="image/*"
        class="hidden"
        [disabled]="isUploading()"
        (change)="onFileSelected($event)"
      />
    </label>

    @if (uploadError()) {
      <p class="mt-2 text-sm text-red-400">{{ uploadError() }}</p>
    }
  </div>
}
