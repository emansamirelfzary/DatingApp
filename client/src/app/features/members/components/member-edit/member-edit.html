<form #editForm="ngForm" (ngSubmit)="submit(editForm)" class="flex flex-1 flex-col">
  <div class="flex-1 space-y-5">
    <div class="flex items-center justify-between border-b border-gray-800 pb-4">
      <h2 class="text-2xl font-bold">Edit profile</h2>
      <button
        type="button"
        (click)="cancel.emit()"
        [disabled]="isSaving"
        class="text-sm text-gray-400 hover:text-white disabled:opacity-50"
      >
        Cancel
      </button>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <label class="space-y-1 text-sm">
        <span class="text-gray-400">Display name</span>
        <input
          #displayName="ngModel"
          [(ngModel)]="formValue.displayName"
          name="displayName"
          required
          maxlength="50"
          class="w-full rounded-lg border border-gray-700 bg-gray-950 px-3 py-2 text-white focus:border-indigo-500 focus:outline-none"
        />
        @if (displayName.invalid && (displayName.dirty || displayName.touched)) {
          <span class="block text-xs text-red-400">Enter a display name up to 50 characters.</span>
        }
      </label>

      <label class="space-y-1 text-sm">
        <span class="text-gray-400">Date of birth</span>
        <input
          #dateOfBirth="ngModel"
          [(ngModel)]="formValue.dateOfBirth"
          name="dateOfBirth"
          type="date"
          [max]="today"
          required
          class="w-full rounded-lg border border-gray-700 bg-gray-950 px-3 py-2 text-white focus:border-indigo-500 focus:outline-none"
        />
        @if (dateOfBirth.invalid && (dateOfBirth.dirty || dateOfBirth.touched)) {
          <span class="block text-xs text-red-400">Enter a valid date of birth.</span>
        }
      </label>

      <label class="space-y-1 text-sm">
        <span class="text-gray-400">Gender</span>
        <input
          #gender="ngModel"
          [(ngModel)]="formValue.gender"
          name="gender"
          required
          maxlength="30"
          class="w-full rounded-lg border border-gray-700 bg-gray-950 px-3 py-2 text-white focus:border-indigo-500 focus:outline-none"
        />
        @if (gender.invalid && (gender.dirty || gender.touched)) {
          <span class="block text-xs text-red-400">Enter a gender up to 30 characters.</span>
        }
      </label>

      <label class="space-y-1 text-sm">
        <span class="text-gray-400">City</span>
        <input
          #city="ngModel"
          [(ngModel)]="formValue.city"
          name="city"
          required
          maxlength="100"
          class="w-full rounded-lg border border-gray-700 bg-gray-950 px-3 py-2 text-white focus:border-indigo-500 focus:outline-none"
        />
        @if (city.invalid && (city.dirty || city.touched)) {
          <span class="block text-xs text-red-400">Enter a city up to 100 characters.</span>
        }
      </label>

      <label class="space-y-1 text-sm sm:col-span-2">
        <span class="text-gray-400">Country</span>
        <input
          #country="ngModel"
          [(ngModel)]="formValue.country"
          name="country"
          required
          maxlength="100"
          class="w-full rounded-lg border border-gray-700 bg-gray-950 px-3 py-2 text-white focus:border-indigo-500 focus:outline-none"
        />
        @if (country.invalid && (country.dirty || country.touched)) {
          <span class="block text-xs text-red-400">Enter a country up to 100 characters.</span>
        }
      </label>

      <label class="space-y-1 text-sm sm:col-span-2">
        <span class="text-gray-400">About me</span>
        <textarea
          #bio="ngModel"
          [(ngModel)]="formValue.bio"
          name="bio"
          maxlength="500"
          rows="5"
          class="w-full resize-y rounded-lg border border-gray-700 bg-gray-950 px-3 py-2 text-white focus:border-indigo-500 focus:outline-none"
        ></textarea>
        @if (bio.invalid && (bio.dirty || bio.touched)) {
          <span class="block text-xs text-red-400">About me must be 500 characters or fewer.</span>
        }
      </label>
    </div>

    @if (saveError) {
      <p role="alert" class="text-sm text-red-400">{{ saveError }}</p>
    }
  </div>

  <div class="mt-5 flex justify-end border-t border-gray-800 pt-4">
    <button
      type="submit"
      [disabled]="isSaving"
      class="rounded-xl bg-indigo-600 px-5 py-2.5 font-medium text-white transition-colors hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ isSaving ? 'Saving...' : 'Save changes' }}
    </button>
  </div>
</form>
