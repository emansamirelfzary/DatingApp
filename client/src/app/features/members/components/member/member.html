<main class="min-h-screen flex items-center bg-gray-950 px-4 py-8 text-white sm:px-6 lg:px-8">
  <div class="mx-auto w-full max-w-5xl">
    <a routerLink="/matches" class="mb-6 inline-flex items-center gap-2 text-sm font-medium text-fuchsia-400 transition-colors hover:text-indigo-300">← Back to Matches</a>

    @if (member(); as user) {
      <section class="grid h-auto grid-cols-1 items-stretch overflow-hidden rounded-2xl border border-gray-800 bg-gray-900/80 shadow-2xl md:grid-cols-12">
        <div class="relative aspect-[4/3] w-full sm:aspect-[4/5] md:col-span-5 md:aspect-auto">
          <img [src]="user.photoUrl || 'assets/user.png'" [alt]="user.displayName" class="h-full w-full object-cover object-top" />
          <div class="absolute inset-0 bg-gradient-to-t from-gray-950/80 via-transparent to-transparent md:hidden"></div>
          <div class="absolute bottom-4 left-4 right-4 md:hidden">
            <h1 class="text-2xl font-bold">{{ user.displayName }}</h1>
            <p class="text-xs text-indigo-300">{{ user.city }}@if (user.country) {, {{ user.country }}}</p>
          </div>
        </div>

        <div class="flex min-h-0 flex-col overflow-y-auto p-5 sm:p-8 md:col-span-7">
          @if (user.id !== currentUser()?.id) {
            <nav class="mb-4 flex shrink-0 items-center gap-2 border-b border-gray-800 pb-3" aria-label="Member views">
              <a [routerLink]="['./']" routerLinkActive="bg-violet-600 text-white" [routerLinkActiveOptions]="{exact: true}" class="rounded-xl px-3.5 py-1.5 text-xs font-semibold text-gray-400 transition-colors hover:text-white">Profile Info</a>
              <a [routerLink]="['messages']" routerLinkActive="bg-violet-600 text-white" class="rounded-xl px-3.5 py-1.5 text-xs font-semibold text-gray-400 transition-colors hover:text-white">Messages &amp; Chat</a>
            </nav>
          }

          <router-outlet />
        </div>
      </section>
    } @else {
      <div class="flex h-96 flex-col items-center justify-center rounded-2xl border border-gray-800 bg-gray-900 text-gray-400">
        <div class="mb-4 h-12 w-12 animate-spin rounded-full border-4 border-indigo-500 border-t-transparent"></div>
        <p class="text-sm">Loading member profile...</p>
      </div>
    }
  </div>
</main>
