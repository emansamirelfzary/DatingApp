<div class="min-h-screen pt-24 pb-12 flex flex-col justify-center items-center px-4 sm:px-6 lg:px-8 bg-gray-900 text-white">

  <div class="w-full max-w-md space-y-8 bg-gray-800/80 backdrop-blur-md p-8 rounded-2xl border border-gray-700/60 shadow-2xl">

    <!-- Header -->
    <div class="text-center space-y-2">
      <h2 class="text-3xl font-extrabold bg-gradient-to-r from-fuchsia-500 via-purple-500 to-pink-500 bg-clip-text text-transparent">
        Create Your Account
      </h2>
      <p class="text-sm text-gray-400">
        Join DatingApp to start connecting today
      </p>
    </div>

    <!-- Register Form -->
    <form class="space-y-5" #registerForm="ngForm" (ngSubmit)="register()">

      <!-- Username -->
      <div>
        <label for="username" class="block text-sm font-medium text-gray-300 mb-1">
          Username
        </label>
        <input
          type="text"
          id="username"
          name="displayName"
          [(ngModel)]="creds.displayName"
          placeholder="Choose a username"
          required
          class="w-full px-4 py-2.5 rounded-lg bg-gray-900/90 border border-gray-700 text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-fuchsia-500 focus:border-transparent transition-all"
        />
      </div>

      <!-- Email Address -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-300 mb-1">
          Email Address
        </label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="creds.email"
          placeholder="you@example.com"
          required
          class="w-full px-4 py-2.5 rounded-lg bg-gray-900/90 border border-gray-700 text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-fuchsia-500 focus:border-transparent transition-all"
        />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-300 mb-1">
          Password
        </label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="creds.password"
          placeholder="••••••••"
          required
          class="w-full px-4 py-2.5 rounded-lg bg-gray-900/90 border border-gray-700 text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-fuchsia-500 focus:border-transparent transition-all"
        />
      </div>

      <div>
        <label for="dateOfBirth" class="block text-sm font-medium text-gray-300 mb-1">Date of birth</label>
        <input type="date" id="dateOfBirth" name="dateOfBirth" [(ngModel)]="creds.dateOfBirth" required class="w-full px-4 py-2.5 rounded-lg bg-gray-900/90 border border-gray-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-fuchsia-500" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <input type="text" name="gender" [(ngModel)]="creds.gender" placeholder="Gender" required class="w-full px-4 py-2.5 rounded-lg bg-gray-900/90 border border-gray-700 text-white placeholder-gray-500 text-sm" />
        <input type="text" name="city" [(ngModel)]="creds.city" placeholder="City" required class="w-full px-4 py-2.5 rounded-lg bg-gray-900/90 border border-gray-700 text-white placeholder-gray-500 text-sm" />
      </div>

      <div>
        <input type="text" name="country" [(ngModel)]="creds.country" placeholder="Country" required class="w-full px-4 py-2.5 rounded-lg bg-gray-900/90 border border-gray-700 text-white placeholder-gray-500 text-sm" />
      </div>

      <!-- Terms Checkbox -->
      <div class="flex items-center gap-2">
        <input
          type="checkbox"
          id="terms"
          name="terms"
          class="w-4 h-4 rounded bg-gray-900 border-gray-700 text-fuchsia-400 focus:ring-fuchsia-500 focus:ring-offset-gray-800"
        />
        <label for="terms" class="text-xs text-gray-400">
          I agree to the <a href="#" class="text-fuchsia-400 hover:underline">Terms of Service</a> and <a href="#" class="text-fuchsia-400 hover:underline">Privacy Policy</a>
        </label>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="registerForm.invalid"
        class="w-full py-3 px-4 bg-gradient-to-r from-fuchsia-600 to-pink-600 hover:from-fuchsia-500 hover:to-pink-500 text-white font-medium text-sm rounded-lg shadow-lg shadow-fuchsia-600/30 hover:shadow-fuchsia-600/50 transition-all duration-200 transform hover:-translate-y-0.5 cursor-pointer"
      >
        Sign Up
      </button>

    </form>

    <!-- Footer / Alternative Action -->
    <div class="text-center pt-2">
      <p class="text-xs text-gray-400">
        Already have an account?
        <a routerLink="/auth/login" class="text-fuchsia-400 hover:text-fuchsia-300 font-semibold transition-colors">
          Log in
        </a>
      </p>
    </div>

  </div>

</div>
