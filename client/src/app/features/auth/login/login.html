<div class="min-h-screen pt-24 pb-12 flex flex-col justify-center items-center px-4 sm:px-6 lg:px-8 bg-gray-900 text-white">

  <div class="w-full max-w-md space-y-8 bg-gray-800/80 backdrop-blur-md p-8 rounded-2xl border border-gray-700/60 shadow-2xl">

    <!-- Header -->
    <div class="text-center space-y-2">
      <h2 class="text-3xl font-extrabold bg-gradient-to-r from-fuchsia-500 via-purple-500 to-pink-500 bg-clip-text text-transparent">
        Welcome Back
      </h2>
      <p class="text-sm text-gray-400">
        Log in to continue your genuine connections
      </p>
    </div>

    <!-- Login Form -->
    <form class="space-y-5" #loginForm="ngForm" (ngSubmit)="login()">

      <!-- Email address -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-300 mb-1">
          Email address
        </label>
        <input
          type="text"
          id="email"
          name="email"
          [(ngModel)]="creds.email"
          placeholder="Enter your email"
          required
          class="w-full px-4 py-2.5 rounded-lg bg-gray-900/90 border border-gray-700 text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all"
        />
      </div>

      <!-- Password -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <label for="password" class="block text-sm font-medium text-gray-300">
            Password
          </label>
          <a href="#" class="text-xs text-fuchsia-400 hover:underline">
            Forgot password?
          </a>
        </div>
        <input
          [(ngModel)]="creds.password"
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          class="w-full px-4 py-2.5 rounded-lg bg-gray-900/90 border border-gray-700 text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all"
        />
      </div>

      <!-- Remember Me Checkbox -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <input
            type="checkbox"
            id="remember"
            name="remember"
            class="w-4 h-4 rounded bg-gray-900 border-gray-700 text-violet-600 focus:ring-violet-500 focus:ring-offset-gray-800"
          />
          <label for="remember" class="text-xs text-gray-400">
            Remember me
          </label>
        </div>
      </div>
      <!-- Submit Button (Violet styling matching navbar login accent) -->
      <button
        type="submit"
        class="w-full py-3 px-4 bg-violet-600 hover:bg-violet-500 text-white font-medium text-sm rounded-lg shadow-lg shadow-violet-600/30 hover:shadow-violet-600/50 transition-all duration-200 transform hover:-translate-y-0.5 cursor-pointer"
       >
        Log In
      </button>
    </form>

    <!-- Footer / Alternative Action -->
    <div class="text-center pt-2">
      <p class="text-xs text-gray-400">
        Don't have an account?
        <a routerLink="/auth/register" class="text-fuchsia-400 hover:text-fuchsia-300 font-semibold transition-colors">
          Sign up
        </a>
      </p>
    </div>
  </div>
</div>
