<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="max-w-md w-full text-center space-y-6">

    <!-- 500 Visual Icon Badge -->
    <div class="relative mx-auto w-28 h-28 flex items-center justify-center">
      <div class="absolute inset-0 bg-gradient-to-tr from-red-600 to-rose-600 rounded-full blur-xl opacity-30 animate-pulse"></div>
      <div class="relative bg-gray-900 border border-red-500/30 rounded-full p-6 text-red-400 shadow-2xl">
        <svg class="w-16 h-16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
    </div>

    <!-- Error Text -->
    <div class="space-y-2">
      <h1 class="text-7xl font-extrabold bg-gradient-to-r from-red-400 via-rose-400 to-pink-500 bg-clip-text text-transparent">
        500
      </h1>
      <h2 class="text-2xl font-bold text-white tracking-tight">
        Internal Server Error
      </h2>
      <p class="text-gray-400 text-sm leading-relaxed max-w-sm mx-auto">
        Something went wrong on our end. Please try refreshing the page or try again later.
      </p>
    </div>

    <!-- Navigation Action Buttons -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-4">
      <button
        (click)="reloadPage()"
        class="w-full sm:w-auto px-6 py-2.5 rounded-lg text-sm font-medium text-white bg-red-600 hover:bg-red-500 transition-colors shadow-lg shadow-red-600/30 cursor-pointer"
      >
        Try Again
      </button>
      <a
        routerLink="/home"
        class="w-full sm:w-auto px-6 py-2.5 rounded-lg text-sm font-medium text-gray-300 hover:text-white bg-gray-800 hover:bg-gray-700 transition-colors border border-gray-700 cursor-pointer"
      >
        Back to Home
      </a>
    </div>

  </div>
</div>
